<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mischa Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --board: #2E4A3B;
  --board-dark: #243B2F;
  --frame: #9A6A3C;
  --chalk: #F1F2EA;
  --chalk-dim: rgba(241,242,234,.6);
  --chalk-faint: rgba(241,242,234,.25);
  --yellow: #F7D46A;
  --pink: #F3A3B5;
  --blue: #A6D8EA;
  --tile: #FFF8E1;
  --tile-ink: #2A2A2A;
  --bg: #6B4726;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #3E2915; --frame: #7A5230; }
}
:root[data-theme="dark"] { --bg: #3E2915; --frame: #7A5230; }

:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; }
body {
  margin: 0; min-height: 100%;
  background: var(--bg);
  font-family: "Andika", "Comic Sans MS", "Trebuchet MS", sans-serif;
  color: var(--chalk);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 16px;
  -webkit-tap-highlight-color: transparent;
}
.board {
  width: 100%; max-width: 680px;
  background: radial-gradient(ellipse at 30% 20%, #35553F 0%, var(--board) 55%, var(--board-dark) 100%);
  border: 14px solid var(--frame);
  border-radius: 10px;
  box-shadow: inset 0 0 40px rgba(0,0,0,.35), 0 8px 0 rgba(0,0,0,.25);
  padding: 22px 16px 20px;
  text-align: center;
}
h1 { margin: 0 0 4px; font-size: 1.7rem; color: var(--yellow); }
h2 { margin: 0 0 8px; font-size: 1.25rem; color: var(--yellow); }
.sub { margin: 0 0 20px; color: var(--chalk-dim); }
.hidden { display: none !important; }

.menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.btn {
  font-family: inherit; font-size: 1.1rem; font-weight: 700;
  padding: 12px 20px; border-radius: 999px; border: 3px solid var(--chalk);
  background: transparent; color: var(--chalk); cursor: pointer;
  touch-action: manipulation;
}
.btn.main { background: var(--yellow); border-color: var(--yellow); color: #3A2A00; }
.btn.small { font-size: .95rem; padding: 8px 16px; border-width: 2px; color: var(--chalk-dim); border-color: var(--chalk-dim); }
.btn:active { transform: scale(.97); }
.btn.menu { border-radius: 16px; text-align: left; padding: 14px 16px; font-size: 1.15rem; }
.btn.menu span { display: block; font-size: .9rem; font-weight: 400; margin-top: 4px; opacity: .85; }
.btn:focus-visible, .choice:focus-visible, input:focus-visible { outline: 4px solid var(--yellow); outline-offset: 3px; }
.row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }

.stars { display: flex; justify-content: center; gap: 6px; margin: 4px 0 14px; flex-wrap: wrap; }
.star { font-size: 1.3rem; color: var(--chalk-faint); }
.star.done { color: var(--yellow); }
.star.helped { color: var(--blue); }
.star.current { color: var(--chalk); text-decoration: underline; text-underline-offset: 6px; }

.prompt { font-size: 1.15rem; margin: 0 0 14px; line-height: 1.5; }
.big { font-size: clamp(1.8rem, 8vw, 2.6rem); font-weight: 700; margin: 8px 0 14px; }
.cheer { font-size: 1.4rem; color: var(--yellow); min-height: 1.5em; margin: 12px 0 0; }
.msg { color: var(--pink); min-height: 1.4em; margin: 10px 0 0; }
.explain {
  text-align: left; background: rgba(0,0,0,.18); border-radius: 10px;
  padding: 12px 14px; margin-top: 12px; line-height: 1.6; font-size: 1rem;
}
.explain ol { margin: 6px 0 0; padding-left: 22px; }

input.ans {
  font-family: inherit; font-size: 1.3rem; font-weight: 700;
  background: var(--tile); color: var(--tile-ink);
  border: 3px solid transparent; border-radius: 10px;
  padding: 6px 8px; text-align: right; min-width: 3.5ch; max-width: 100%;
}
input.ans.right { background: var(--yellow); }
input.ans.wrong { background: var(--pink); animation: shake .35s; }
input.ans::placeholder { color: #B8AD8A; }

/* area model */
.area { display: grid; gap: 6px; margin: 6px auto 10px; max-width: 560px; }
.area .h { font-weight: 700; font-size: 1.15rem; color: var(--yellow); align-self: end; padding: 2px; }
.area .h.side { align-self: center; text-align: right; padding-right: 6px; }
.area .cell {
  border: 2px dashed var(--chalk-dim); border-radius: 8px; padding: 6px 4px;
  display: flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center;
  min-width: 0;
}
.area .cell small { color: var(--chalk-dim); font-size: .85rem; white-space: nowrap; }
.area .cell input { width: 100% !important; font-size: 1.1rem; text-align: center; padding: 6px 2px; }

/* standard algorithm */
.alg { display: inline-grid; grid-template-columns: auto auto; column-gap: 12px; row-gap: 6px; margin: 4px auto 8px; align-items: center; }
.alg .op { font-size: 1.6rem; font-weight: 700; text-align: left; }
.alg .num { font-family: "Courier New", monospace; font-size: 1.7rem; font-weight: 700; text-align: right; letter-spacing: .08em; }
.alg .bar { grid-column: 1 / -1; border-top: 3px solid var(--chalk); }
.alg input { font-family: "Courier New", monospace; letter-spacing: .08em; justify-self: end; }
.alg .note { grid-column: 2; text-align: right; color: var(--chalk-dim); font-size: .85rem; margin-top: -4px; }

/* long division workspace */
.ld { display: inline-grid; gap: 4px 2px; margin: 4px auto 6px; align-items: end; }
.ld .lab { font-family: "Courier New", monospace; font-size: 1.6rem; font-weight: 700; text-align: right; padding-right: 4px; white-space: nowrap; }
.ld .lab.sign { color: var(--chalk-dim); }
.ld .dd {
  font-family: "Courier New", monospace; font-size: 1.8rem; font-weight: 700; text-align: center;
  border-top: 3px solid var(--chalk); padding-top: 2px; cursor: grab; touch-action: none; user-select: none;
  border-radius: 4px;
}
.ld .dd.first { border-left: 3px solid var(--chalk); border-top-left-radius: 14px; }
.ld .dd.sel { background: var(--blue); color: var(--tile-ink); }
.ld input.dg {
  width: 100%; height: 2.4rem; padding: 0; text-align: center;
  font-family: "Courier New", monospace; font-size: 1.55rem; font-weight: 700;
  background: rgba(255,255,255,.07); color: var(--chalk);
  border: none; border-bottom: 2px dashed var(--chalk-faint); border-radius: 4px;
}
.ld input.dg.q { background: rgba(247,212,106,.15); }
.ld input.dg.prod { border-bottom: 3px solid var(--chalk); }
.ld input.dg.brought { color: var(--blue); }
.ld input.dg.right { background: var(--yellow); color: var(--tile-ink); }
.ld input.dg.wrong { background: var(--pink); color: var(--tile-ink); animation: shake .35s; }
.ghost {
  position: fixed; pointer-events: none; z-index: 10; transform: translate(-50%, -60%);
  font-family: "Courier New", monospace; font-size: 2rem; font-weight: 700;
  background: var(--blue); color: var(--tile-ink); border-radius: 8px; padding: 0 8px;
}
.tip { font-size: .95rem; color: var(--chalk-dim); margin: 0 0 10px; line-height: 1.5; }

/* place value chart */
.pv { max-width: 520px; margin: 6px auto 10px; }
.pvh, .pvrow { display: grid; grid-template-columns: repeat(7, 1fr); }
.pvh span { font-size: .72rem; line-height: 1.15; color: var(--chalk-dim); padding: 0 1px 4px; align-self: end; }
.pvh span.dec { color: var(--blue); }
.pvwrap { position: relative; margin-bottom: 8px; }
.pvlab { text-align: left; font-size: .85rem; color: var(--chalk-dim); margin: 2px 0; }
.pvrow { position: relative; height: 3.2rem; }
.pvrow .bgc { border-left: 1px solid var(--chalk-faint); background: rgba(255,255,255,.05); }
.pvrow .bgc.dec { background: rgba(166,216,234,.12); }
.pvrow .bgc:first-child { border-left: none; }
.pvd {
  position: absolute; top: 0; height: 100%; width: calc(100% / 7);
  left: calc(var(--c) * 100% / 7);
  display: flex; align-items: center; justify-content: center;
  font-family: "Courier New", monospace; font-size: clamp(1.6rem, 7vw, 2.2rem); font-weight: 700;
  transition: left .4s ease;
}
.pvd.zero { color: var(--chalk-dim); transition: none; }
.pvd.hiY { color: var(--yellow); text-decoration: underline; text-underline-offset: 5px; }
.pvd.hiB { color: var(--blue); text-decoration: underline; text-underline-offset: 5px; }
.pvdot {
  position: absolute; bottom: .55rem; left: calc(4 * 100% / 7); transform: translateX(-50%);
  width: .6rem; height: .6rem; border-radius: 50%; background: var(--yellow);
}
.hiY { color: var(--yellow); }
.hiB { color: var(--blue); }
.pvnow { font-size: 1.5rem; font-weight: 700; margin: 4px 0 0; }
.slide-row .btn { font-size: 1.3rem; padding: 12px 22px; }
.slide-row .btn:disabled { opacity: .35; }
@media (prefers-reduced-motion: reduce) { .pvd { transition: none; } }

/* multiple choice */
.choices { display: flex; flex-direction: column; gap: 10px; align-items: center; margin: 6px 0; }
.choice {
  width: 100%; max-width: 480px;
  background: var(--tile); color: var(--tile-ink);
  border: none; border-radius: 14px;
  font-family: inherit; font-size: 1.15rem; font-weight: 700; line-height: 1.4;
  padding: 12px 14px; box-shadow: 0 5px 0 #C9B98A;
  cursor: pointer; touch-action: manipulation;
}
.choice.num { font-size: 1.6rem; max-width: 300px; }
.choice.right { background: var(--yellow); box-shadow: 0 5px 0 #C2A03F; }
.choice.wrong { background: var(--pink); animation: shake .35s; }
.choice.fade { opacity: .45; }
.choice:disabled { cursor: default; }

.final-list { list-style: none; padding: 0; margin: 10px auto 16px; font-size: 1.1rem; line-height: 1.8; }

@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
@media (prefers-reduced-motion: reduce) { input.ans.wrong, .choice.wrong { animation: none; } }
</style>
</head>
<body>
<main class="board">
  <h1>Mischa Math</h1>

  <section id="menu">
    <p class="sub">Multiplying, dividing, decimals and standard form. New numbers every time.</p>
    <div class="menu-grid">
      <button class="btn main menu" data-mode="flash">⚡ Quick flash cards<span>Fast warm-ups: facts, tens, decimals</span></button>
      <button class="btn menu" data-mode="area">🟩 Area model<span>Break it into parts and add them up</span></button>
      <button class="btn menu" data-mode="std">✏️ Standard algorithm<span>Stack it and multiply, with decimals too</span></button>
      <button class="btn menu" data-mode="why">🔍 Where does the decimal go?<span>Use a product you know. How do you know?</span></button>
      <button class="btn menu" data-mode="div">➗ Long division<span>Find the quotient and the remainder</span></button>
      <button class="btn menu" data-mode="form">🔢 Standard form<span>Turn expanded and word form into a number</span></button>
      <button class="btn menu" data-mode="place">🧭 Place value moves<span>Tenths, hundredths, tens: how they connect</span></button>
      <button class="btn menu" data-mode="mix">🎲 Mix it up<span>A little of everything</span></button>
    </div>
  </section>

  <section id="game" class="hidden">
    <div class="stars" id="stars"></div>
    <h2 id="qTitle"></h2>
    <div id="qbox"></div>
    <p class="msg" id="msg"></p>
    <p class="cheer" id="cheer"></p>
    <div class="explain hidden" id="explain"></div>
    <div class="row" id="actRow">
      <button class="btn main" id="checkBtn">Check</button>
      <button class="btn" id="showBtn">👀 Show me</button>
    </div>
    <div class="row hidden" id="nextRow"><button class="btn main" id="nextBtn">Next</button></div>
    <div class="row"><button class="btn small back">Back to menu</button></div>
  </section>

  <section id="finish" class="hidden">
    <div class="big">🎉</div>
    <p class="cheer" id="finalMsg"></p>
    <ul class="final-list" id="finalList"></ul>
    <div class="row">
      <button class="btn main" id="againBtn">Play again</button>
      <button class="btn back">Back to menu</button>
    </div>
  </section>
</main>

<script>
/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const CHEERS = ["Great job!","You got it!","Math star!","Awesome!","Nailed it!","Way to go!","Smart thinking!"];

// Numbers are kept as [integer, decimal places] pairs so decimals never pick up float errors.
function norm([n, d]) { while (d > 0 && n % 10 === 0) { n /= 10; d--; } if (d < 0) { n *= 10 ** -d; d = 0; } return [n, d]; }
function fmt(p) {
  let [n, d] = norm(p);
  const neg = n < 0; n = Math.abs(n);
  let s = String(n), ip = s, fp = "";
  if (d > 0) { s = s.padStart(d + 1, "0"); ip = s.slice(0, -d); fp = s.slice(-d); }
  ip = ip.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (neg ? "-" : "") + ip + (fp ? "." + fp : "");
}
const val = ([n, d]) => n / 10 ** d;
const mul = (a, b) => [a[0] * b[0], a[1] + b[1]];
function sum(list) { const d = Math.max(...list.map(p => p[1])); return [list.reduce((t, p) => t + p[0] * 10 ** (d - p[1]), 0), d]; }
const W = n => [n, 0];
function parseAns(s) {
  s = String(s).replace(/[,\s$]/g, "");
  if (!/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return NaN;
  return parseFloat(s);
}
const same = (a, b) => Math.round(a * 1e6) === Math.round(b * 1e6);
const places = n => n === 1 ? "1 place" : n + " places";

// a whole number with `len` digits, no zeros, so every place-value part shows up
function digitsNum(len) { let s = String(R(1, 9)); while (s.length < len) s += R(1, 9); return +s; }

// split [n,d] into place-value parts: 485 -> 400, 80, 5 ; 4.7 -> 4, 0.7
function parts([n, d]) {
  const s = String(n), out = [];
  for (let i = 0; i < s.length; i++) {
    const dig = +s[i]; if (!dig) continue;
    const place = s.length - 1 - i - d;
    out.push(place >= 0 ? [dig * 10 ** place, 0] : [dig, -place]);
  }
  return out;
}

function inp(ans, width, extra = "") {
  const w = width || fmt(ans).length + 2;
  return `<input class="ans" type="text" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false"
    data-ans="${val(ans)}" data-show="${fmt(ans)}" style="width:${w + 1.5}ch" ${extra}>`;
}

/* ---------- game generators ---------- */
// Each returns { title, html, explain, check?(box), setup?(box, api) }.

function genFlash() {
  const t = R(0, 8);
  let q, a, hint = "";
  if (t === 0) { const x = R(3, 12), y = R(3, 12); q = `${x} × ${y}`; a = W(x * y); }
  else if (t === 1) { const x = R(3, 12), y = R(3, 9); q = `${x * y} ÷ ${y}`; a = W(x); }
  else if (t === 2) {
    const x = R(2, 9) * pick([10, 100]), y = R(2, 9) * 10;
    q = `${fmt(W(x))} × ${fmt(W(y))}`; a = W(x * y);
    hint = `Multiply ${String(x).replace(/0+$/, "")} × ${String(y).replace(/0+$/, "")}, then add the zeros back.`;
  }
  else if (t === 3) {
    const n = digitsNum(R(2, 3)), d = R(1, 2), p = R(1, 3);
    q = `${fmt([n, d])} × ${fmt(W(10 ** p))}`; a = norm([n, d - p]);
    hint = `Times ${fmt(W(10 ** p))} moves every digit ${places(p)} to the left.`;
  }
  else if (t === 4) {
    const n = digitsNum(R(2, 3)), p = R(1, 2);
    q = `${fmt(W(n))} ÷ ${fmt(W(10 ** p))}`; a = [n, p];
    hint = `Divided by ${fmt(W(10 ** p))} moves every digit ${places(p)} to the right.`;
  }
  else if (t === 5) { const x = R(2, 9), y = R(2, 9); q = `0.${x} × ${y}`; a = [x * y, 1]; hint = `${x} × ${y} = ${x * y}, and there is 1 decimal place.`; }
  else if (t === 6) { const x = R(2, 9), y = R(2, 9); q = `0.${x} × 0.${y}`; a = [x * y, 2]; hint = `${x} × ${y} = ${x * y}, and there are 2 decimal places.`; }
  else if (t === 7) {
    const x = digitsNum(3), dx = R(0, 2), y = digitsNum(2), dy = dx ? R(0, 1) : 1;
    const k = dx + dy;
    return {
      title: "⚡ Flash card",
      html: `<p class="prompt">Count the decimal places in the factors.</p>
        <div class="big">${fmt([x, dx])} × ${fmt([y, dy])}</div>
        <p class="prompt">How many decimal places go in the product? ${inp(W(k), 2)}</p>`,
      explain: `${fmt([x, dx])} has ${places(dx)} after the decimal and ${fmt([y, dy])} has ${places(dy)}. ${dx} + ${dy} = ${k}.`
    };
  }
  else {
    const x = R(12, 89) * 10 + R(1, 9), y = R(12, 89);
    const rx = Math.round(x / 100) * 100, ry = Math.round(y / 10) * 10;
    return {
      title: "⚡ Estimate it",
      html: `<p class="prompt">Round ${x} to the nearest hundred and ${y} to the nearest ten. Then multiply.</p>
        <div class="big">${x} × ${y} ≈ ${inp(W(rx * ry))}</div>`,
      explain: `${x} rounds to ${fmt(W(rx))} and ${y} rounds to ${ry}. ${fmt(W(rx))} × ${ry} = ${fmt(W(rx * ry))}.`
    };
  }
  return {
    title: "⚡ Flash card",
    html: `<div class="big">${q} = ${inp(a)}</div>`,
    explain: `${q} = ${fmt(a)}.${hint ? " " + hint : ""}`
  };
}

function genArea() {
  const dec = Math.random() < 0.35;
  const A = dec ? [digitsNum(2), 1] : W(digitsNum(Math.random() < 0.65 ? 3 : 2));
  const B = W(digitsNum(2));
  const pa = parts(A), pb = parts(B);
  const prods = [];
  let cells = `<div></div>` + pa.map(p => `<div class="h">${fmt(p)}</div>`).join("");
  pb.forEach(b => {
    cells += `<div class="h side">${fmt(b)}</div>`;
    pa.forEach(a => {
      const p = mul(a, b); prods.push(p);
      cells += `<div class="cell"><small>${fmt(a)} × ${fmt(b)}</small>${inp(p, 4)}</div>`;
    });
  });
  const total = mul(A, B);
  return {
    title: "🟩 Area model",
    html: `<p class="prompt">Break ${fmt(A)} and ${fmt(B)} into place-value parts. Fill in each box, then add them all.</p>
      <div class="big" style="font-size:1.8rem">${fmt(A)} × ${fmt(B)}</div>
      <div class="area" style="grid-template-columns: auto repeat(${pa.length}, minmax(0, 1fr))">${cells}</div>
      <p class="prompt">Add the parts: ${fmt(A)} × ${fmt(B)} = ${inp(total)}</p>`,
    explain: `${fmt(A)} = ${pa.map(fmt).join(" + ")} and ${fmt(B)} = ${pb.map(fmt).join(" + ")}.<br>
      Parts: ${prods.map(fmt).join(" + ")} = <b>${fmt(sum(prods))}</b>`
  };
}

function genStd() {
  const dec = Math.random() < 0.4;
  const a = digitsNum(Math.random() < 0.7 ? 3 : 2), b = digitsNum(2);
  let da = 0, db = 0;
  if (dec) { da = R(0, 2); db = da ? R(0, 1) : 1; }
  const A = [a, da], B = [b, db], k = da + db;
  const ones = b % 10, tens = Math.floor(b / 10) * 10;
  const r1 = a * ones, r2 = a * tens, tot = a * b;
  const w = fmt(W(tot)).length + 3;
  const decLine = dec
    ? `<p class="prompt">Now place the decimal. Count the decimal places in both factors.<br>
        ${fmt(A)} × ${fmt(B)} = ${inp([tot, k])}</p>` : "";
  return {
    title: "✏️ Standard algorithm",
    html: `<p class="prompt">${dec ? "Multiply like whole numbers first. Ignore the decimals for now." : "Multiply the ones, then the tens, then add."}</p>
      <div class="alg">
        <span></span><span class="num">${fmt(A)}</span>
        <span class="op">×</span><span class="num">${fmt(B)}</span>
        <div class="bar"></div>
        <span></span>${inp(W(r1), w)}
        <span class="note">${a} × ${ones}</span>
        <span class="op">+</span>${inp(W(r2), w)}
        <span class="note">${a} × ${tens}</span>
        <div class="bar"></div>
        <span></span>${inp(W(tot), w)}
      </div>
      ${decLine}`,
    explain: `${a} × ${ones} = ${fmt(W(r1))}<br>${a} × ${tens} = ${fmt(W(r2))}<br>${fmt(W(r1))} + ${fmt(W(r2))} = <b>${fmt(W(tot))}</b>` +
      (dec ? `<br>${fmt(A)} has ${places(da)} and ${fmt(B)} has ${places(db)}, so ${places(k)} in all: <b>${fmt(A)} × ${fmt(B)} = ${fmt([tot, k])}</b>` : "")
  };
}

function genWhy() {
  const a = digitsNum(3), b = digitsNum(2), P = a * b;
  const [da, db] = pick([[0, 1], [1, 0], [2, 0], [1, 1], [2, 1], [0, 1], [1, 1]]);
  const k = da + db, A = [a, da], B = [b, db];
  const answer = fmt([P, k]);
  const shifts = shuffle([k - 1, k + 1, k + 2, -1].filter(s => s !== k)).slice(0, 3);
  const nums = shuffle([answer, ...shifts.map(s => fmt([P, s]))]);

  const how = f => f[1] === 0 ? `${fmt(W(f[0]))} is the same` : `${fmt(f)} is ${fmt(W(f[0]))} ÷ ${fmt(W(10 ** f[1]))}`;
  const right = `${how(A)} and ${how(B)}, so the product is ${fmt(W(P))} ÷ ${fmt(W(10 ** k))} = ${answer}.`;
  const wrongs = [
    `Multiplying always makes a bigger number, so the answer has to be more than ${fmt(W(P))}.`,
    `Count all the digits: ${String(a).length + String(b).length} digits, so move the decimal ${String(a).length + String(b).length} places.`,
  ];
  if (Math.max(da, db) !== k) wrongs.push(`Line up the decimal points like adding, so the answer has ${places(Math.max(da, db))} after the decimal.`);
  else wrongs.push(`Decimals don't change a product, so it is still ${fmt(W(P))}.`);
  const reasons = shuffle([right, ...shuffle(wrongs).slice(0, 2)]);

  const unit = 10 ** (String(a).length - 1), lead = Math.round(a / unit) * unit;
  const est = val([lead, da]) * val(B);
  const estTxt = Number(est.toFixed(4)).toLocaleString("en-US", { maximumFractionDigits: 4 });

  return {
    title: "🔍 Where does the decimal go?",
    html: `<p class="prompt">You know that <b>${fmt(W(a))} × ${fmt(W(b))} = ${fmt(W(P))}</b>.</p>
      <div class="big" style="font-size:1.8rem">What is ${fmt(A)} × ${fmt(B)}?</div>
      <div class="choices" id="c1">${nums.map(n => `<button class="choice num" data-v="${n}">${n}</button>`).join("")}</div>
      <div id="part2" class="hidden">
        <p class="prompt" style="margin-top:18px"><b>How do you know?</b></p>
        <div class="choices" id="c2">${reasons.map((r, i) => `<button class="choice" data-i="${i}">${r}</button>`).join("")}</div>
      </div>`,
    explain: `${right}<br>Estimate to check: ${fmt(A)} × ${fmt(B)} is about ${fmt([lead, da])} × ${fmt(B)} = ${estTxt}, and ${answer} is close to that.`,
    setup(box, api) {
      const c1 = box.querySelector("#c1"), c2 = box.querySelector("#c2");
      const good = r => r === right;
      const stage = (wrap, isRight, next) => {
        wrap.querySelectorAll(".choice").forEach(btn => btn.addEventListener("click", () => {
          if (btn.disabled) return;
          if (isRight(btn)) {
            btn.classList.add("right");
            wrap.querySelectorAll(".choice").forEach(c => { c.disabled = true; if (c !== btn) c.classList.add("fade"); });
            next();
          } else {
            api.helped();
            btn.classList.remove("wrong"); void btn.offsetWidth; btn.classList.add("wrong");
            api.msg("Not that one. Try again.");
          }
        }));
      };
      stage(c1, btn => btn.dataset.v === answer, () => { api.msg(""); box.querySelector("#part2").classList.remove("hidden"); });
      stage(c2, btn => good(reasons[+btn.dataset.i]), () => { api.msg(""); api.solved(); });
      this.reveal = () => {
        [[c1, btn => btn.dataset.v === answer], [c2, btn => good(reasons[+btn.dataset.i])]].forEach(([wrap, ok]) =>
          wrap.querySelectorAll(".choice").forEach(c => { c.disabled = true; c.classList.add(ok(c) ? "right" : "fade"); }));
        box.querySelector("#part2").classList.remove("hidden");
      };
    }
  };
}

function divSteps(N, d) {
  const s = String(N), steps = [];
  let cur = 0, started = false;
  for (let i = 0; i < s.length; i++) {
    cur = cur * 10 + +s[i];
    if (!started && cur < d && i < s.length - 1) continue;
    started = true;
    const q = Math.floor(cur / d), m = q * d, rem = cur - m;
    let line = `How many ${d}s in ${cur}? <b>${q}</b>. ${q} × ${d} = ${m}. ${cur} − ${m} = ${rem}.`;
    if (i < s.length - 1) line += ` Bring down the ${s[i + 1]} to make ${rem * 10 + +s[i + 1]}.`;
    steps.push(line);
    cur = rem;
  }
  return steps;
}

// The standard written layout: quotient digits plus alternating product / difference rows.
function divLayout(N, d) {
  const s = String(N), n = s.length, quot = Array(n).fill(""), rows = [];
  const blank = kind => ({ kind, cells: Array(n).fill(""), brought: -1 });
  const place = (row, str, end) => { for (let j = 0; j < str.length; j++) row.cells[end - str.length + 1 + j] = str[j]; };
  let cur = 0, started = false, last = null;
  for (let i = 0; i < n; i++) {
    cur = cur * 10 + +s[i];
    if (!started && cur < d && i < n - 1) continue;
    if (started) { last.cells[i] = s[i]; last.brought = i; }
    started = true;
    const q = Math.floor(cur / d), m = q * d, rem = cur - m;
    quot[i] = String(q);
    const prod = blank("prod"), diff = blank("diff");
    place(prod, String(m), i); place(diff, String(rem), i);
    rows.push(prod, diff); last = diff; cur = rem;
  }
  return { quot, rows };
}

function genDiv() {
  const two = Math.random() < 0.4;
  const d = two ? R(11, 29) : R(3, 9);
  let N;
  if (Math.random() < 0.4) N = d * R(two ? 12 : 21, two ? 99 : 999);
  else N = two ? R(250, 2999) : (Math.random() < 0.5 ? R(100, 999) : R(1000, 9999));
  const q = Math.floor(N / d), r = N % d;
  const s = String(N), n = s.length, sol = divLayout(N, d), nRows = 2 * n;
  const cell = (r, c, cls) => `<input class="dg ${cls}" data-r="${r}" data-c="${c}" type="text" inputmode="numeric" autocomplete="off" aria-label="row ${r + 2} column ${c + 1}">`;
  let grid = `<span></span>` + s.split("").map((_, c) => cell(-1, c, "q")).join("");
  grid += `<span class="lab">${d})</span>` + s.split("").map((ch, c) => `<span class="dd${c ? "" : " first"}" data-c="${c}">${ch}</span>`).join("");
  for (let r = 0; r < nRows; r++) {
    const prod = r % 2 === 0;
    grid += `<span class="lab${prod ? " sign" : ""}">${prod ? "−" : ""}</span>` + s.split("").map((_, c) => cell(r, c, prod ? "wk prod" : "wk")).join("");
  }
  return {
    title: "➗ Long division",
    html: `<div class="big" style="font-size:1.8rem">${fmt(W(N))} ÷ ${d}</div>
      <p class="tip">Type one digit per box. Write the quotient in the top row.
        To bring a digit down, drag it from ${fmt(W(N))}, or tap it and then tap a box.</p>
      <div class="ld" style="grid-template-columns: auto repeat(${n}, 2.3rem)">${grid}</div>
      <p class="prompt">Remainder: R ${inp(W(r), 3)}</p>
      <div class="row" style="margin-top:4px"><button class="btn small" id="clearWork">Erase my work</button></div>`,
    explain: `<ol>${divSteps(N, d).map(s => `<li>${s}</li>`).join("")}</ol>
      Answer: <b>${fmt(W(q))} R ${r}</b>. Check: ${fmt(W(q))} × ${d}${r ? ` + ${r}` : ""} = ${fmt(W(N))}`,
    setup(box, api) {
      const cells = [...box.querySelectorAll("input.dg")];
      const at = (r, c) => box.querySelector(`input.dg[data-r="${r}"][data-c="${c}"]`);
      const rem = box.querySelector("input.ans");
      let sel = null;
      const put = (el, digit) => { el.value = digit; el.classList.add("brought"); el.classList.remove("right", "wrong"); };
      const clearSel = () => { sel = null; box.querySelectorAll(".dd.sel").forEach(x => x.classList.remove("sel")); };

      cells.forEach(el => {
        const r = +el.dataset.r, c = +el.dataset.c;
        el.addEventListener("input", () => {
          const v = el.value.replace(/\D/g, "").slice(-1);
          el.value = v; el.classList.remove("brought", "right", "wrong");
          if (v) { const nx = at(r, c + 1); if (nx) nx.focus(); }
        });
        el.addEventListener("keydown", e => {
          const move = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] }[e.key];
          if (move) { const t = at(r + move[0], c + move[1]); if (t) { e.preventDefault(); t.focus(); } }
          else if (e.key === "Backspace" && !el.value) { const t = at(r, c - 1); if (t) { e.preventDefault(); t.value = ""; t.focus(); } }
          else if (e.key === "Enter") { e.preventDefault(); check(); }
        });
        el.addEventListener("click", () => { if (sel !== null && r >= 0 && !done) { put(el, sel); clearSel(); } });
      });

      // drag a dividend digit down (or tap it, then tap a box)
      box.querySelectorAll(".dd").forEach(dd => {
        dd.addEventListener("pointerdown", e => {
          if (done) return;
          e.preventDefault();
          const x0 = e.clientX, y0 = e.clientY;
          let ghost = null;
          const onMove = ev => {
            if (!ghost && Math.hypot(ev.clientX - x0, ev.clientY - y0) > 6) {
              ghost = document.createElement("div"); ghost.className = "ghost"; ghost.textContent = dd.textContent;
              document.body.appendChild(ghost);
            }
            if (ghost) { ghost.style.left = ev.clientX + "px"; ghost.style.top = ev.clientY + "px"; }
          };
          const onUp = ev => {
            window.removeEventListener("pointermove", onMove);
            window.removeEventListener("pointerup", onUp);
            window.removeEventListener("pointercancel", onUp);
            if (ghost) {
              ghost.remove();
              const t = document.elementFromPoint(ev.clientX, ev.clientY);
              const target = t && t.closest && t.closest("input.dg.wk");
              if (target && box.contains(target)) put(target, dd.textContent);
              clearSel();
            } else {
              const was = dd.classList.contains("sel");
              clearSel();
              if (!was) { sel = dd.textContent; dd.classList.add("sel"); }
            }
          };
          window.addEventListener("pointermove", onMove);
          window.addEventListener("pointerup", onUp);
          window.addEventListener("pointercancel", onUp);
        });
      });

      box.querySelector("#clearWork").addEventListener("click", () => {
        if (done) return;
        cells.forEach(el => { el.value = ""; el.classList.remove("brought", "right", "wrong"); });
        rem.value = ""; rem.classList.remove("right", "wrong");
        clearSel(); api.msg("");
      });

      const qCells = cells.filter(el => el.dataset.r === "-1");
      this.check = () => {
        const typed = qCells.map(el => el.value).join("").replace(/^0+(?=\d)/, "");
        if (!typed) { api.msg("Write your quotient in the top row first."); return false; }
        const qOk = typed === String(q);
        const rv = rem.value.trim(), rOk = rv === "" ? r === 0 : same(parseAns(rv), r);
        qCells.forEach(el => { el.classList.remove("right", "wrong"); if (el.value) { void el.offsetWidth; el.classList.add(qOk ? "right" : "wrong"); } });
        rem.classList.remove("right", "wrong"); void rem.offsetWidth; rem.classList.add(rOk ? "right" : "wrong");
        if (qOk && rOk) { api.msg(""); return true; }
        api.msg(!qOk && !rOk ? "Not quite. Look over your steps and try again."
          : !qOk ? "Your remainder is right, but check the quotient." : "Your quotient is right. Check the remainder.");
        return false;
      };
      this.reveal = () => {
        clearSel();
        qCells.forEach((el, c) => { el.value = sol.quot[c]; el.classList.remove("wrong"); });
        cells.filter(el => el.dataset.r !== "-1").forEach(el => {
          const row = sol.rows[+el.dataset.r], c = +el.dataset.c;
          el.value = row ? row.cells[c] : "";
          el.classList.remove("right", "wrong");
          el.classList.toggle("brought", !!row && row.brought === c);
        });
      };
    }
  };
}

/* ---------- place value ---------- */
// A number here is { sig: "35", low: -1 } -> digits 3,5 with the last digit in the tenths place (3.5).
// Places run from 3 (thousands) down to -3 (thousandths); chart column = 3 - place.
const PV_NAMES = ["thou-<br>sands", "hun-<br>dreds", "tens", "ones", "tenths", "hun-<br>dredths", "thou-<br>sandths"];
const pvHigh = x => x.low + x.sig.length - 1;
const pvFits = x => x.low >= -3 && pvHigh(x) <= 3;
const pvVal = x => [+x.sig, -x.low];
const pvShift = (x, k) => ({ sig: x.sig, low: x.low + k });
const pvStr = x => fmt(pvVal(x));
const TIMES = { 1: "10", 2: "100", 3: "1,000" };
const PART = { 1: "1/10", 2: "1/100", 3: "1/1,000" };

function pvRandom(len) {
  // distinct nonzero digits so "which digit" questions are never ambiguous
  const digs = shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9]).slice(0, len).join("");
  for (let t = 0; t < 50; t++) { const x = { sig: digs, low: R(-3, 2) }; if (pvFits(x) && pvHigh(x) >= -1 && x.low <= 0) return x; }
  return { sig: digs, low: -1 };
}
function pvPair(maxK = 2) {
  for (let t = 0; t < 200; t++) {
    const x = pvRandom(R(1, 2)), k = pick([1, 2, -1, -2, 1, -1, 3].filter(v => Math.abs(v) <= maxK));
    if (pvFits(pvShift(x, k))) return [x, k];
  }
  return [{ sig: "35", low: -1 }, 1];
}

function pvChart(rows) {
  const head = PV_NAMES.map((n, c) => `<span class="${c >= 4 ? "dec" : ""}">${n}</span>`).join("");
  const body = rows.map((r, i) => `
    ${r.label ? `<div class="pvlab">${r.label}</div>` : ""}
    <div class="pvrow" data-row="${i}">${[0, 1, 2, 3, 4, 5, 6].map(c => `<span class="bgc${c >= 4 ? " dec" : ""}"></span>`).join("")}<span class="pvdot"></span></div>`).join("");
  return `<div class="pv"><div class="pvh">${head}</div><div class="pvwrap">${body}</div></div>`;
}
// Place the digits of x into a chart row. Digit elements are reused so a shift slides them.
function pvDraw(row, x, hi = {}) {
  row.querySelectorAll(".pvd.zero").forEach(z => z.remove());
  let digs = [...row.querySelectorAll(".pvd:not(.zero)")];
  if (digs.length !== x.sig.length) {
    digs.forEach(d => d.remove());
    digs = x.sig.split("").map(ch => { const el = document.createElement("span"); el.className = "pvd"; el.textContent = ch; row.appendChild(el); return el; });
  }
  const high = pvHigh(x);
  digs.forEach((el, i) => {
    const place = high - i;
    el.style.setProperty("--c", 3 - place);
    el.classList.toggle("hiY", hi[place] === "Y");
    el.classList.toggle("hiB", hi[place] === "B");
  });
  // placeholder zeros that standard form needs: 350 -> 0 in the ones, 0.035 -> 0 in the ones and tenths
  const zeros = [];
  if (x.low > 0) for (let pl = 0; pl < x.low; pl++) zeros.push(pl);
  if (high < 0) for (let pl = high + 1; pl <= 0; pl++) zeros.push(pl);
  zeros.forEach(pl => { const z = document.createElement("span"); z.className = "pvd zero"; z.textContent = "0"; z.style.setProperty("--c", 3 - pl); row.appendChild(z); });
}
function colorNum(x, hi) {
  // the number as text, with highlighted digits wrapped in color spans
  const str = pvStr(x); let place = pvHigh(x) < 0 ? 0 : pvHigh(x), out = "";
  for (const ch of str) {
    if (ch === ".") { out += "."; continue; }
    if (ch === ",") { out += ","; continue; }
    out += hi[place] ? `<span class="hi${hi[place]}">${ch}</span>` : ch;
    place--;
  }
  return out;
}

function mcSetup(box, api) {
  const btns = [...box.querySelectorAll(".choices .choice")];
  btns.forEach(btn => btn.addEventListener("click", () => {
    if (btn.disabled) return;
    if (btn.dataset.ok) {
      btn.classList.add("right");
      btns.forEach(c => { c.disabled = true; if (c !== btn) c.classList.add("fade"); });
      api.msg(""); api.solved();
    } else {
      api.helped();
      btn.classList.remove("wrong"); void btn.offsetWidth; btn.classList.add("wrong");
      api.msg("Not that one. Look at which place each digit is in.");
    }
  }));
  return () => btns.forEach(c => { c.disabled = true; c.classList.add(c.dataset.ok ? "right" : "fade"); });
}
const choicesHtml = (list, cls = "num") => `<div class="choices">${shuffle(list).map(([t, ok]) => `<button class="choice ${cls}"${ok ? ' data-ok="1"' : ""}>${t}</button>`).join("")}</div>`;
const RULE = "Every place is 10 times the place to its right. Move one place left: × 10. Move one place right: ÷ 10.";

function genPlace() {
  const t = pick(["slide", "slide", "times", "digit", "same", "fill"]);

  if (t === "slide") {
    const [x, k] = pvPair(3);
    const goalTxt = k > 0
      ? pick([`Make it <b>${TIMES[k]} times as big</b>.`, `Show <b>${pvStr(x)} × ${TIMES[k]}</b>.`])
      : pick([`Make it <b>${PART[-k]} as big</b>.`, `Show <b>${pvStr(x)} ÷ ${TIMES[-k]}</b>.`]);
    const target = pvShift(x, k);
    return {
      title: "🧭 Slide the digits",
      html: `<p class="prompt">This is <b>${pvStr(x)}</b>. ${goalTxt}</p>
        ${pvChart([{}])}
        <p class="pvnow">Now: <span id="pvNow">${pvStr(x)}</span></p>
        <div class="row slide-row">
          <button class="btn" id="pvL" aria-label="Slide digits left">⬅</button>
          <button class="btn" id="pvR" aria-label="Slide digits right">➡</button>
        </div>`,
      explain: `${pvStr(x)} ${k > 0 ? "× " + TIMES[k] : "÷ " + TIMES[-k]} = <b>${pvStr(target)}</b>.
        Every digit moved ${places(Math.abs(k))} to the ${k > 0 ? "left" : "right"}.<br>${RULE}`,
      setup(box, api) {
        const row = box.querySelector(".pvrow");
        let now = x;
        const draw = () => {
          pvDraw(row, now);
          box.querySelector("#pvNow").textContent = pvStr(now);
          box.querySelector("#pvL").disabled = done || !pvFits(pvShift(now, 1));
          box.querySelector("#pvR").disabled = done || !pvFits(pvShift(now, -1));
        };
        box.querySelector("#pvL").addEventListener("click", () => { if (!done) { now = pvShift(now, 1); api.msg(""); draw(); } });
        box.querySelector("#pvR").addEventListener("click", () => { if (!done) { now = pvShift(now, -1); api.msg(""); draw(); } });
        draw();
        this.check = () => {
          if (now.low === target.low) return true;
          api.msg(now.low === x.low ? "Slide the digits first." : `Not quite. ${pvStr(now)} is not ${k > 0 ? TIMES[k] + " times" : PART[-k]} of ${pvStr(x)} yet.`);
          return false;
        };
        this.reveal = () => { now = target; draw(); };
        this.onDone = draw;
      }
    };
  }

  if (t === "times") {
    const [x, k] = pvPair(3), y = pvShift(x, k);
    const opts = k > 0
      ? [["10 times", k === 1], ["100 times", k === 2], ["1,000 times", k === 3], ["1/10 as big", false]]
      : [["1/10", k === -1], ["1/100", k === -2], ["1/1,000", k === -3], ["10 times as big", false]];
    return {
      title: "🧭 How many times as big?",
      html: `<p class="prompt">${k > 0 ? `<b>${pvStr(y)}</b> is how many times as big as <b>${pvStr(x)}</b>?` : `<b>${pvStr(y)}</b> is what part of <b>${pvStr(x)}</b>?`}</p>
        ${pvChart([{ label: pvStr(x) }, { label: pvStr(y) }])}
        ${choicesHtml(opts)}`,
      explain: `The digits of ${pvStr(x)} moved ${places(Math.abs(k))} to the ${k > 0 ? "left" : "right"} to make ${pvStr(y)}, so
        ${pvStr(y)} is <b>${k > 0 ? TIMES[k] + " times as big as" : PART[-k] + " of"}</b> ${pvStr(x)}.<br>${RULE}`,
      setup(box, api) {
        const rows = box.querySelectorAll(".pvrow");
        pvDraw(rows[0], x); pvDraw(rows[1], y);
        this.reveal = mcSetup(box, api);
      }
    };
  }

  if (t === "digit") {
    const x = pvRandom(R(3, 4)); const high = pvHigh(x);
    const i = R(0, x.sig.length - 1), g = +x.sig[i], place = high - i;
    const worth = pl => fmt([g, -pl]);
    const cand = [place + 1, place - 1, place + 2, place - 2].filter(pl => pl <= 3 && pl >= -3);
    const opts = [[worth(place), true], ...shuffle(cand).slice(0, 3).map(pl => [worth(pl), false])];
    const hi = { [place]: "Y" };
    return {
      title: "🧭 What is the digit worth?",
      html: `<p class="prompt">In <b>${colorNum(x, hi)}</b>, what is the <span class="hiY"><b>${g}</b></span> worth?</p>
        ${pvChart([{}])}${choicesHtml(opts)}`,
      explain: `The ${g} is in the <b>${PV_NAMES[3 - place].replace("-<br>", "")}</b> place, so it is worth <b>${worth(place)}</b>.
        One place to the left it would be worth ${worth(place + 1)}; one place to the right, ${worth(place - 1)}.`,
      setup(box, api) { pvDraw(box.querySelector(".pvrow"), x, hi); this.reveal = mcSetup(box, api); }
    };
  }

  if (t === "same") {
    let x, p1, p2, g;
    for (let tries = 0; tries < 100; tries++) {
      g = R(1, 9); const gap = R(1, 2); p2 = R(-3, 1); p1 = p2 + gap;
      const hi_ = Math.max(p1, 0), lo_ = Math.min(p2, -1);
      if (hi_ > 2) continue;
      let sig = "";
      for (let pl = hi_; pl >= lo_; pl--) sig += (pl === p1 || pl === p2) ? g : pick([1, 2, 3, 4, 5, 6, 7, 8, 9].filter(v => v !== g));
      x = { sig, low: lo_ }; if (pvFits(x)) break;
    }
    const k = p1 - p2, hi = { [p1]: "Y", [p2]: "B" };
    const askBig = Math.random() < 0.6;
    const opts = askBig
      ? [["10 times", k === 1], ["100 times", k === 2], ["1,000 times", false], ["1/10 as much", false]]
      : [["1/10", k === 1], ["1/100", k === 2], ["1/1,000", false], ["10 times as much", false]];
    const nm = pl => PV_NAMES[3 - pl].replace("-<br>", "");
    return {
      title: "🧭 Same digit, different place",
      html: `<p class="prompt">In <b>${colorNum(x, hi)}</b>, ${askBig
          ? `the <span class="hiY"><b>yellow ${g}</b></span> is worth how many times the <span class="hiB"><b>blue ${g}</b></span>?`
          : `the <span class="hiB"><b>blue ${g}</b></span> is worth what part of the <span class="hiY"><b>yellow ${g}</b></span>?`}</p>
        ${pvChart([{}])}${choicesHtml(opts)}`,
      explain: `The yellow ${g} is in the ${nm(p1)} place (${fmt([g, -p1])}). The blue ${g} is in the ${nm(p2)} place (${fmt([g, -p2])}).
        They are ${places(k)} apart, so the yellow one is worth <b>${TIMES[k]} times</b> the blue one, and the blue one is <b>${PART[k]}</b> of the yellow one.`,
      setup(box, api) { pvDraw(box.querySelector(".pvrow"), x, hi); this.reveal = mcSetup(box, api); }
    };
  }

  // fill in the blank
  const [x, k] = pvPair(3), y = pvShift(x, k), f = TIMES[Math.abs(k)], op = k > 0 ? "×" : "÷";
  const form = R(0, 1);
  const html = form === 0
    ? `<div class="big" style="font-size:1.8rem">${pvStr(x)} ${op} ${f} = ${inp(pvVal(y), 8)}</div>`
    : `<div class="big" style="font-size:1.8rem">${pvStr(x)} ${op} ${inp(W(10 ** Math.abs(k)), 6)} = ${pvStr(y)}</div>`;
  return {
    title: "🧭 Fill in the blank",
    html: `<p class="prompt">Use the chart to help. ${pvStr(x)} is shown.</p>${pvChart([{}])}${html}`,
    explain: `${pvStr(x)} ${op} ${f} = <b>${pvStr(y)}</b>. The digits move ${places(Math.abs(k))} to the ${k > 0 ? "left" : "right"}.<br>${RULE}`,
    draw(box) { pvDraw(box.querySelector(".pvrow"), x); }
  };
}

const ONES = ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function w999(n) {
  const out = [];
  if (n >= 100) { out.push(ONES[Math.floor(n / 100)] + " hundred"); n %= 100; }
  if (n >= 20) out.push(TENS[Math.floor(n / 10)] + (n % 10 ? "-" + ONES[n % 10] : ""));
  else if (n > 0) out.push(ONES[n]);
  return out.join(" ");
}
function words([n, d]) {
  const ip = Math.floor(n / 10 ** d), fp = n % 10 ** d;
  let s = ip >= 1000 ? w999(Math.floor(ip / 1000)) + " thousand" + (ip % 1000 ? " " + w999(ip % 1000) : "") : w999(ip);
  if (fp) s += " and " + w999(fp) + " " + (d === 1 ? "tenth" : "hundredth") + (fp === 1 ? "" : "s");
  return s;
}
const PLACE = { 4: "ten thousands", 3: "thousands", 2: "hundreds", 1: "tens", 0: "ones", "-1": "tenths", "-2": "hundredths" };
const PLACE1 = { 4: "ten thousand", 3: "thousand", 2: "hundred", 1: "ten", 0: "one", "-1": "tenth", "-2": "hundredth" };

function genForm() {
  const len = R(3, 5), d = R(0, 2);
  let s = String(R(1, 9));
  for (let i = 1; i < len + d; i++) s += Math.random() < 0.3 ? 0 : R(1, 9);
  if (d) s = s.slice(0, -1) + R(1, 9);
  const num = [+s, d];
  const terms = [];
  for (let i = 0; i < s.length; i++) {
    const dig = +s[i]; if (!dig) continue;
    terms.push({ dig, place: s.length - 1 - i - d });
  }
  const t = R(0, 3);
  let prompt, shown;
  if (t === 0) { prompt = "Expanded form"; shown = terms.map(x => fmt([x.dig, -x.place])).join(" + "); }
  else if (t === 1) { prompt = "Expanded form with multiplication"; shown = terms.map(x => `(${x.dig} × ${fmt([1, -x.place])})`).join(" + "); }
  else if (t === 2) { prompt = "Word form"; shown = words(num); }
  else { prompt = "Unit form"; shown = terms.map(x => `${x.dig} ${x.dig === 1 ? PLACE1[x.place] : PLACE[x.place]}`).join(", "); }
  return {
    title: "🔢 Standard form",
    html: `<p class="prompt">${prompt}:</p>
      <div class="big" style="font-size:${t === 2 ? "1.35rem" : "1.5rem"};line-height:1.5">${shown}</div>
      <p class="prompt">Write it in standard form: ${inp(num, 12)}</p>`,
    explain: `Standard form: <b>${fmt(num)}</b><br>Word form: ${words(num)}`
  };
}

const GENS = { flash: genFlash, area: genArea, std: genStd, why: genWhy, div: genDiv, form: genForm, place: genPlace };
const ROUND = { flash: 10, area: 5, std: 5, why: 6, div: 5, form: 8, place: 8, mix: 8 };
const NAMES = { flash: "flash cards", area: "area models", std: "standard algorithm problems", why: "decimal puzzles", div: "long division problems", form: "standard form problems", place: "place value puzzles", mix: "mixed problems" };

/* ---------- game loop ---------- */
let mode = null, idx = 0, results = [], helped = false, done = false, cur = null;

function show(id) { ["menu", "game", "finish"].forEach(s => $(s).classList.toggle("hidden", s !== id)); }

function drawStars() {
  const s = $("stars"); s.innerHTML = "";
  for (let i = 0; i < ROUND[mode]; i++) {
    const el = document.createElement("span");
    el.className = "star"; el.textContent = "★";
    if (results[i] === "clean") el.classList.add("done");
    else if (results[i] === "helped") el.classList.add("helped");
    else if (i === idx) el.classList.add("current");
    s.appendChild(el);
  }
}

function startGame(m) { mode = m; idx = 0; results = []; nextQuestion(); }

function nextQuestion() {
  helped = false; done = false;
  const gen = mode === "mix" ? pick(Object.values(GENS)) : GENS[mode];
  cur = gen();
  show("game"); drawStars();
  $("qTitle").textContent = cur.title;
  const box = $("qbox");
  box.innerHTML = cur.html;
  $("msg").textContent = ""; $("cheer").textContent = "";
  $("explain").classList.add("hidden"); $("explain").innerHTML = "";
  $("actRow").classList.remove("hidden"); $("nextRow").classList.add("hidden");
  if (cur.setup) cur.setup(box, { helped: () => { helped = true; }, msg: t => { $("msg").textContent = t; }, solved });
  if (cur.draw) cur.draw(box);
  $("checkBtn").classList.toggle("hidden", !!cur.setup && !cur.check);
  const firstDigit = box.querySelector("input.dg");
  const inputs = [...box.querySelectorAll("input.ans")];
  inputs.forEach((el, i) => {
    el.addEventListener("keydown", e => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      const nextEmpty = inputs.slice(i + 1).find(x => !x.value);
      if (nextEmpty) nextEmpty.focus(); else check();
    });
    el.addEventListener("input", () => el.classList.remove("wrong", "right"));
  });
  const first = firstDigit || inputs[0];
  if (first && matchMedia("(pointer: fine)").matches) first.focus();
}

function check() {
  if (done) return;
  if (cur.check) { if (cur.check()) solved(); return; }
  if (cur.setup) return;
  const inputs = [...$("qbox").querySelectorAll("input.ans")];
  let ok = true, blank = false;
  inputs.forEach(el => {
    if (!el.value.trim()) { blank = true; ok = false; el.classList.remove("right", "wrong"); return; }
    const good = same(parseAns(el.value), +el.dataset.ans);
    el.classList.toggle("right", good);
    el.classList.remove("wrong");
    if (!good) { void el.offsetWidth; el.classList.add("wrong"); ok = false; }
  });
  if (ok) { $("msg").textContent = ""; solved(); }
  else $("msg").textContent = inputs.some(el => el.classList.contains("wrong"))
    ? "Not quite. Fix the pink boxes." : "Fill in every box first.";
}

function reveal() {
  if (done) return;
  helped = true;
  if (cur.reveal) cur.reveal();
  $("qbox").querySelectorAll("input.ans").forEach(el => { el.value = el.dataset.show; el.classList.remove("wrong"); el.classList.add("right"); });
  $("msg").textContent = "";
  solved(true);
}

function solved(revealed) {
  done = true;
  results[idx] = helped ? "helped" : "clean";
  $("qbox").querySelectorAll("input").forEach(el => { el.readOnly = true; });
  if (cur.onDone) cur.onDone();
  $("cheer").textContent = revealed ? "Here's how it works:" : pick(CHEERS);
  $("explain").innerHTML = cur.explain;
  $("explain").classList.remove("hidden");
  $("actRow").classList.add("hidden");
  $("nextRow").classList.remove("hidden");
  $("nextBtn").textContent = idx === ROUND[mode] - 1 ? "See my stars" : "Next";
  drawStars();
  $("nextBtn").focus();
}

function next() {
  idx++;
  if (idx >= ROUND[mode]) return showFinish();
  nextQuestion();
}

function showFinish() {
  show("finish");
  const n = ROUND[mode], clean = results.filter(r => r === "clean").length;
  $("finalMsg").textContent = clean === n ? `All ${n} ${NAMES[mode]} with no help. Amazing!` : `You finished all ${n} ${NAMES[mode]}! ${clean} with no help.`;
  $("finalList").innerHTML = `<li>${"⭐".repeat(clean)}${"💙".repeat(n - clean)}</li>`;
}

document.querySelectorAll("#menu [data-mode]").forEach(b => b.addEventListener("click", () => startGame(b.dataset.mode)));
$("checkBtn").addEventListener("click", check);
$("showBtn").addEventListener("click", reveal);
$("nextBtn").addEventListener("click", next);
$("againBtn").addEventListener("click", () => startGame(mode));
document.querySelectorAll(".back").forEach(b => b.addEventListener("click", () => show("menu")));
show("menu");
</script>
</body>
</html>
