<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chalkboard Spelling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --board: #2E4A3B;
  --board-dark: #243B2F;
  --frame: #9A6A3C;
  --chalk: #F1F2EA;
  --chalk-dim: rgba(241,242,234,.55);
  --yellow: #F7D46A;
  --pink: #F3A3B5;
  --blue: #A6D8EA;
  --tile: #FFF8E1;
  --tile-ink: #2A2A2A;
  --bg: #6B4726;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #3E2915; --frame: #7A5230; }
}
:root[data-theme="dark"] { --bg: #3E2915; --frame: #7A5230; }

:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; min-height: 100%;
  background: var(--bg);
  font-family: "Andika", "Comic Sans MS", "Trebuchet MS", sans-serif;
  color: var(--chalk);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
  -webkit-tap-highlight-color: transparent;
}
.board {
  width: 100%; max-width: 640px;
  background: radial-gradient(ellipse at 30% 20%, #35553F 0%, var(--board) 55%, var(--board-dark) 100%);
  border: 14px solid var(--frame);
  border-radius: 10px;
  box-shadow: inset 0 0 40px rgba(0,0,0,.35), 0 8px 0 rgba(0,0,0,.25);
  padding: 22px 18px 20px;
  text-align: center;
  position: relative;
}
h1 { margin: 0 0 4px; font-size: 1.6rem; font-weight: 700; color: var(--yellow); letter-spacing: .02em; }
.sub { margin: 0 0 22px; color: var(--chalk-dim); font-size: 1rem; }

.stars { display: flex; justify-content: center; gap: 6px; margin: 8px 0 18px; flex-wrap: wrap; }
.star { font-size: 1.4rem; color: var(--chalk-dim); transition: transform .3s; }
.star.done { color: var(--yellow); transform: scale(1.15); }
.star.helped { color: var(--blue); transform: scale(1.1); }
.star.current { color: var(--chalk); text-decoration: underline; text-underline-offset: 6px; }

.prompt { font-size: 1.15rem; margin: 0 0 10px; min-height: 1.5em; }
.bigword {
  font-size: clamp(3rem, 14vw, 4.8rem); font-weight: 700; margin: 10px 0 18px;
  letter-spacing: .06em; color: var(--chalk);
  text-shadow: 0 0 1px rgba(255,255,255,.6);
}
.slots { display: flex; justify-content: center; gap: 6px; margin: 14px 0 24px; flex-wrap: wrap; }
.slot {
  width: clamp(36px, 10vw, 52px); height: clamp(48px, 13vw, 64px);
  border-bottom: 4px solid var(--chalk);
  font-size: clamp(1.8rem, 8vw, 2.6rem); font-weight: 700;
  display: flex; align-items: flex-end; justify-content: center; padding-bottom: 2px;
}
.slot.next { border-bottom-color: var(--yellow); }
.slot.filled { animation: pop .25s ease-out; }
.slots.win .slot { color: var(--yellow); border-bottom-color: var(--yellow); }

.tiles { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }
.tile {
  width: clamp(48px, 14vw, 62px); height: clamp(48px, 14vw, 62px);
  background: var(--tile); color: var(--tile-ink);
  border: none; border-radius: 12px;
  font-family: inherit; font-size: clamp(1.7rem, 7vw, 2.2rem); font-weight: 700;
  box-shadow: 0 5px 0 #C9B98A;
  cursor: pointer; touch-action: manipulation;
  transition: transform .08s;
}
.tile:active { transform: translateY(3px); box-shadow: 0 2px 0 #C9B98A; }
.tile.used { visibility: hidden; }
.tile.wrong { animation: shake .35s; background: var(--pink); }
.tile.hint { outline: 4px solid var(--yellow); outline-offset: 3px; }

.choices { display: flex; flex-direction: column; gap: 12px; align-items: center; margin-bottom: 20px; }
.choice {
  width: 100%; max-width: 340px;
  background: var(--tile); color: var(--tile-ink);
  border: none; border-radius: 14px;
  font-family: inherit; font-size: clamp(1.6rem, 7vw, 2.1rem); font-weight: 700;
  padding: 14px 10px; box-shadow: 0 5px 0 #C9B98A;
  cursor: pointer; touch-action: manipulation;
}
.choice:active { transform: translateY(3px); box-shadow: 0 2px 0 #C9B98A; }
.choice.right { background: var(--yellow); box-shadow: 0 5px 0 #C2A03F; }
.choice.wrong { background: var(--pink); animation: shake .35s; }
.choice.fade { opacity: .45; }

.tile:focus-visible, .btn:focus-visible, .choice:focus-visible { outline: 4px solid var(--yellow); outline-offset: 3px; }

.row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.row + .row { margin-top: 12px; }
.btn {
  font-family: inherit; font-size: 1.1rem; font-weight: 700;
  padding: 12px 20px; border-radius: 999px; border: 3px solid var(--chalk);
  background: transparent; color: var(--chalk); cursor: pointer;
  touch-action: manipulation;
}
.btn.main { background: var(--yellow); border-color: var(--yellow); color: #3A2A00; }
.btn.small { font-size: .95rem; padding: 8px 16px; border-width: 2px; color: var(--chalk-dim); border-color: var(--chalk-dim); }
.btn:active { transform: scale(.96); }
.btn.menu { font-size: 1.25rem; padding: 18px 22px; width: 100%; max-width: 360px; }
.btn.menu span { display: block; font-size: .9rem; font-weight: 400; margin-top: 4px; opacity: .85; }
.hidden { display: none !important; }
a.home { color: var(--chalk-dim); font-size: .95rem; }

.cheer { font-size: 1.5rem; color: var(--yellow); min-height: 1.6em; margin: 0 0 12px; }
.final-list { list-style: none; padding: 0; margin: 10px auto 20px; columns: 2; max-width: 320px; font-size: 1.3rem; }
.final-list li { margin: 4px 0; break-inside: avoid; }
.wordlist { color: var(--chalk-dim); font-size: 1rem; line-height: 1.8; margin-top: 24px; }

@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}
@keyframes pop { 0% { transform: scale(1.5); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) {
  .tile.wrong, .choice.wrong, .slot.filled { animation: none; }
}
</style>
</head>
<body>
<main class="board">
  <h1>Chalkboard Spelling</h1>

  <!-- Menu -->
  <section id="menu">
    <p class="sub"><span id="wordCount"></span> words. Three ways to play.</p>
    <div class="row">
      <button class="btn main menu" id="playBuild">Build the word<span>Hear it, hide it, spell it with letter tiles</span></button>
    </div>
    <div class="row">
      <button class="btn menu" id="playSpot">Spot the right spelling<span>Three lookalikes. Only one is correct</span></button>
    </div>
    <div class="row">
      <button class="btn menu" id="playHard">Hard mode<span>Hear it and spell it. No looking first, no peeking</span></button>
    </div>
    <p class="wordlist" id="wordlist"></p>
    <div class="row"><a class="home" href="../">Back to Lourdes</a></div>
  </section>

  <!-- Game 1: look -->
  <section id="look" class="hidden">
    <div class="stars" id="stars1"></div>
    <p class="prompt">Look at the word and say it out loud.</p>
    <div class="bigword" id="bigword"></div>
    <div class="row">
      <button class="btn" id="hearLook">🔊 Hear it</button>
      <button class="btn main" id="hideBtn">Hide it and spell</button>
    </div>
    <div class="row"><button class="btn small back">Back to menu</button></div>
  </section>

  <!-- Game 1: spell -->
  <section id="spell" class="hidden">
    <div class="stars" id="stars2"></div>
    <p class="prompt" id="spellPrompt">Tap the letters in order.</p>
    <div class="slots" id="slots"></div>
    <p class="cheer" id="cheer"></p>
    <div class="tiles" id="tiles"></div>
    <div class="row" id="helpRow">
      <button class="btn" id="hearSpell">🔊 Hear it</button>
      <button class="btn" id="peekBtn">👀 Peek</button>
      <button class="btn" id="hintBtn">💡 Hint</button>
    </div>
    <div class="row hidden" id="nextRow">
      <button class="btn main" id="nextBtn">Next word</button>
    </div>
    <div class="row"><button class="btn small back">Back to menu</button></div>
  </section>

  <!-- Game 2 -->
  <section id="spot" class="hidden">
    <div class="stars" id="stars3"></div>
    <p class="prompt" id="spotPrompt">Which one is spelled correctly?</p>
    <div class="choices" id="choices"></div>
    <p class="cheer" id="spotCheer"></p>
    <div class="row" id="spotHelpRow">
      <button class="btn" id="hearSpot">🔊 Hear it</button>
    </div>
    <div class="row hidden" id="spotNextRow">
      <button class="btn main" id="spotNextBtn">Next word</button>
    </div>
    <div class="row"><button class="btn small back">Back to menu</button></div>
  </section>

  <!-- Finish -->
  <section id="finish" class="hidden">
    <div class="bigword" style="font-size:3rem">🎉</div>
    <p class="cheer" id="finalMsg"></p>
    <ul class="final-list" id="finalList"></ul>
    <div class="row">
      <button class="btn main" id="againBtn">Play again</button>
      <button class="btn back">Back to menu</button>
    </div>
  </section>
</main>

<script>
const WORDS = ["it's","that's","she's","isn't","aren't","wasn't","I'll","you'll","she'll"];
const LOOKALIKES = {
  "it's":   ["i'ts","its'","itt's"],
  "that's": ["thats","tha'ts","thats'"],
  "she's":  ["shes","sh'es","shes'"],
  "isn't":  ["isnt","is'nt","isn'nt"],
  "aren't": ["arent","are'nt","arn't"],
  "wasn't": ["wasnt","was'nt","wasen't"],
  "I'll":   ["I'l","Il'l","I'lll"],
  "you'll": ["youll","you'l","yo'ull"],
  "she'll": ["she'l","sh'ell","shel'l"]
};
const CHEERS = ["Great job!","You got it!","Super speller!","Awesome!","Nailed it!","Way to go!","Slay, girl!","Six seven!","Clock it, girl!"];
const DECOYS = "abcdehimnoprstuwy";

let mode = null, order = [], idx = 0, pos = 0, helped = false, results = [], hintTimer = null, locked = false;
const $ = id => document.getElementById(id);
const word = () => order[idx];

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function speak(text) {
  try {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.8; u.lang = "en-US";
    speechSynthesis.speak(u);
  } catch (e) {}
}

function show(id) {
  ["menu","look","spell","spot","finish"].forEach(s => $(s).classList.toggle("hidden", s !== id));
}

function drawStars() {
  ["stars1","stars2","stars3"].forEach(id => {
    const s = $(id);
    s.innerHTML = "";
    for (let i = 0; i < order.length; i++) {
      const el = document.createElement("span");
      el.className = "star";
      el.textContent = "★";
      if (results[i] === "clean") el.classList.add("done");
      else if (results[i] === "helped") el.classList.add("helped");
      else if (i === idx) el.classList.add("current");
      s.appendChild(el);
    }
  });
}

function startGame(which) {
  mode = which;
  order = shuffle(WORDS);
  idx = 0; results = [];
  showRound();
}

function showRound() {
  if (mode === "build") showLook();
  else if (mode === "hard") { drawStars(); showSpell(); speak(word()); }
  else showSpot();
}

/* ---------- Game 1: build the word ---------- */
function showLook() {
  drawStars();
  show("look");
  $("bigword").textContent = word();
  speak(word());
  $("hideBtn").focus();
}

function showSpell() {
  show("spell");
  $("helpRow").classList.remove("hidden");
  $("nextRow").classList.add("hidden");
  $("cheer").textContent = "";
  $("spellPrompt").textContent = spellPrompt();
  $("peekBtn").classList.toggle("hidden", mode === "hard");
  pos = 0; helped = false;

  const w = word();
  const slots = $("slots");
  slots.className = "slots";
  slots.innerHTML = "";
  for (let i = 0; i < w.length; i++) {
    const d = document.createElement("div");
    d.className = "slot" + (i === 0 ? " next" : "");
    slots.appendChild(d);
  }

  let letters = w.split("");
  const pool = shuffle(DECOYS.split("").filter(c => !w.toLowerCase().includes(c)));
  letters.push(pool[0], pool[1]);
  letters = shuffle(letters);

  const tiles = $("tiles");
  tiles.innerHTML = "";
  letters.forEach(ch => {
    const b = document.createElement("button");
    b.className = "tile";
    b.textContent = ch;
    b.dataset.ch = ch;
    b.setAttribute("aria-label", ch === "'" ? "apostrophe" : "letter " + ch);
    b.addEventListener("click", () => tryLetter(b));
    tiles.appendChild(b);
  });
}

function tryLetter(tile) {
  const w = word();
  if (pos >= w.length || tile.classList.contains("used")) return;
  clearHint();
  if (tile.dataset.ch === w[pos]) {
    tile.classList.add("used");
    const slots = $("slots").children;
    slots[pos].textContent = w[pos];
    slots[pos].classList.remove("next");
    slots[pos].classList.add("filled");
    pos++;
    if (pos < w.length) slots[pos].classList.add("next");
    else finishWord();
  } else {
    tile.classList.remove("wrong");
    void tile.offsetWidth;
    tile.classList.add("wrong");
    setTimeout(() => tile.classList.remove("wrong"), 400);
  }
}

function finishWord() {
  $("slots").classList.add("win");
  results[idx] = helped ? "helped" : "clean";
  const cheer = CHEERS[Math.floor(Math.random() * CHEERS.length)];
  $("cheer").textContent = cheer;
  $("spellPrompt").textContent = helped ? "You did it! Try it with no help next time." : "Perfect, no help needed!";
  speak(cheer + " " + word());
  drawStars();
  $("helpRow").classList.add("hidden");
  $("nextRow").classList.remove("hidden");
  $("nextBtn").textContent = idx === order.length - 1 ? "See my stars" : "Next word";
  $("nextBtn").focus();
}

/* ---------- Game 2: spot the right spelling ---------- */
function showSpot() {
  drawStars();
  show("spot");
  locked = false;
  $("spotCheer").textContent = "";
  $("spotPrompt").textContent = "Which one is spelled correctly?";
  $("spotHelpRow").classList.remove("hidden");
  $("spotNextRow").classList.add("hidden");

  const w = word();
  const fakes = shuffle(LOOKALIKES[w]).slice(0, 2);
  const options = shuffle([w, ...fakes]);

  const box = $("choices");
  box.innerHTML = "";
  options.forEach(opt => {
    const b = document.createElement("button");
    b.className = "choice";
    b.textContent = opt;
    b.dataset.opt = opt;
    b.addEventListener("click", () => pickSpelling(b));
    box.appendChild(b);
  });
  speak(w);
}

function pickSpelling(btn) {
  if (locked) return;
  const w = word();
  if (btn.dataset.opt === w) {
    locked = true;
    btn.classList.add("right");
    [...$("choices").children].forEach(c => { if (c !== btn) c.classList.add("fade"); });
    results[idx] = helped ? "helped" : "clean";
    const cheer = CHEERS[Math.floor(Math.random() * CHEERS.length)];
    $("spotCheer").textContent = cheer;
    $("spotPrompt").textContent = "That's the one.";
    speak(cheer);
    drawStars();
    $("spotHelpRow").classList.add("hidden");
    $("spotNextRow").classList.remove("hidden");
    $("spotNextBtn").textContent = idx === order.length - 1 ? "See my stars" : "Next word";
    $("spotNextBtn").focus();
  } else {
    helped = true;
    btn.classList.remove("wrong");
    void btn.offsetWidth;
    btn.classList.add("wrong");
    $("spotPrompt").textContent = "Not that one. Listen again and look closely.";
    setTimeout(() => btn.classList.remove("wrong"), 400);
  }
}

/* ---------- shared ---------- */
function nextWord() {
  idx++;
  helped = false;
  if (idx >= order.length) return showFinish();
  showRound();
}

function showFinish() {
  drawStars();
  show("finish");
  const clean = results.filter(r => r === "clean").length;
  $("finalMsg").textContent = clean === order.length
    ? "All " + order.length + " words with no help. Amazing!"
    : "You finished all " + order.length + "! " + clean + " with no help.";
  const list = $("finalList");
  list.innerHTML = "";
  order.forEach((w, i) => {
    const li = document.createElement("li");
    li.textContent = (results[i] === "clean" ? "⭐ " : "💙 ") + w;
    list.appendChild(li);
  });
  speak("You did it!");
}

function spellPrompt() {
  return mode === "hard" ? "Listen, then tap the letters in order." : "Tap the letters in order.";
}

function clearHint() {
  clearTimeout(hintTimer);
  document.querySelectorAll(".tile.hint").forEach(t => t.classList.remove("hint"));
}

$("wordlist").textContent = WORDS.join(" · ");
$("wordCount").textContent = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve"][WORDS.length] || WORDS.length;
$("playBuild").addEventListener("click", () => startGame("build"));
$("playSpot").addEventListener("click", () => startGame("spot"));
$("playHard").addEventListener("click", () => startGame("hard"));
$("hideBtn").addEventListener("click", showSpell);
$("hearLook").addEventListener("click", () => speak(word()));
$("hearSpell").addEventListener("click", () => speak(word()));
$("hearSpot").addEventListener("click", () => speak(word()));
$("nextBtn").addEventListener("click", nextWord);
$("spotNextBtn").addEventListener("click", nextWord);
$("againBtn").addEventListener("click", () => startGame(mode));
document.querySelectorAll(".back").forEach(b => b.addEventListener("click", () => show("menu")));

$("peekBtn").addEventListener("click", () => {
  helped = true;
  const p = $("spellPrompt");
  p.textContent = word();
  p.style.fontSize = "2rem";
  setTimeout(() => {
    p.textContent = spellPrompt();
    p.style.fontSize = "";
  }, 2000);
});

$("hintBtn").addEventListener("click", () => {
  helped = true;
  clearHint();
  const need = word()[pos];
  const t = [...document.querySelectorAll(".tile:not(.used)")].find(x => x.dataset.ch === need);
  if (t) {
    t.classList.add("hint");
    hintTimer = setTimeout(clearHint, 2500);
  }
});

document.addEventListener("keydown", e => {
  if ($("spell").classList.contains("hidden")) return;
  if (!$("nextRow").classList.contains("hidden")) return;
  const k = e.key.toLowerCase();
  if (!/^[a-z']$/.test(k)) return;
  const tiles = [...document.querySelectorAll(".tile:not(.used)")];
  const right = tiles.find(t => t.dataset.ch.toLowerCase() === k && k === word()[pos].toLowerCase());
  const any = tiles.find(t => t.dataset.ch.toLowerCase() === k);
  if (right) tryLetter(right);
  else if (any) tryLetter(any);
});

show("menu");
</script>
</body>
</html>
